name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & check
        run: ./gradlew build --no-daemon --stacktrace

      - name: Garantir que os testes de integração rodaram
        if: always()
        run: |
          reports=$(ls bootstrap/build/test-results/test/TEST-*IntegrationTest.xml 2>/dev/null || true)
          if [ -z "$reports" ]; then
            echo "Nenhum relatório de teste de integração encontrado."
            exit 1
          fi
          if grep -lE 'skipped="[1-9]' $reports; then
            echo "ERRO: testes de integração foram ignorados (Docker/Testcontainers não detectado)."
            exit 1
          fi
          echo "Testes de integração executados."

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: '**/build/reports/'
          if-no-files-found: ignore
          retention-days: 7
