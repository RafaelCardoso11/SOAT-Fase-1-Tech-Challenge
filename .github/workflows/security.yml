name: Security

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build e extração das dependências do fat jar
        run: |
          ./gradlew :bootstrap:bootJar --no-daemon
          jar=$(ls bootstrap/build/libs/*.jar | grep -v -- '-plain')
          mkdir -p build/scan
          unzip -qo "$jar" 'BOOT-INF/lib/*' -d build/scan

      # SHA pinado (v0.36.0): tags 0.0.1–0.34.2 foram comprometidas no incidente de supply-chain de mar/2026
      - name: Trivy — vulnerabilidades em dependências
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: build/scan
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          output: docs/security/trivy-report.txt
          exit-code: '0'

      - name: Commit do relatório (evidência no repo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/security/trivy-report.txt
          git diff --staged --quiet || git commit -m "chore(security): atualiza relatório Trivy [skip ci]"
          git push
