name: Security

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t oficina:scan -f docker/Dockerfile .

      - name: Trivy — vulnerabilidades (OS + dependências)
        env:
          TRIVY_SHOW_SUPPRESSED: 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: oficina:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          output: docs/security/trivy-report.txt
          trivyignores: .trivyignore
          exit-code: '1'

      - name: Publicar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: docs/security/trivy-report.txt
          retention-days: 90
