name: Security

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t oficina:scan -f docker/Dockerfile .

      - name: Trivy — vulnerabilidades (OS + dependências)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: oficina:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          output: docs/security/trivy-report.txt
          exit-code: '0'

      - name: Commit do relatório (evidência no repo)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/security/trivy-report.txt
          git diff --staged --quiet || git commit -m "chore(security): atualiza relatório Trivy [skip ci]"
          git push
