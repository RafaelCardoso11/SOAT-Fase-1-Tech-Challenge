# Sobe o ambiente completo: aplicação + PostgreSQL + Mailpit (SMTP de dev).
# Rode a partir da raiz do projeto:  docker compose -f docker/docker-compose.yml up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oficina}
      POSTGRES_USER: ${POSTGRES_USER:-oficina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oficina}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI web (http://localhost:8025)

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      APP_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-oficina}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-oficina}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFICACAO_EMAIL_ENABLED: "true"
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
