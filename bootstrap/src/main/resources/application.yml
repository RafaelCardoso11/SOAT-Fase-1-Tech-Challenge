spring:
  application:
    name: oficina
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina}
    username: ${SPRING_DATASOURCE_USERNAME:oficina}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

notificacao:
  email:
    enabled: ${NOTIFICACAO_EMAIL_ENABLED:false}
    remetente: ${NOTIFICACAO_EMAIL_REMETENTE:oficina@exemplo.com}
    destinatario-padrao: ${NOTIFICACAO_EMAIL_DESTINATARIO:cliente@exemplo.com}
    url-base: ${NOTIFICACAO_URL_BASE:http://localhost:8080}

orcamento:
  validade-dias: ${ORCAMENTO_VALIDADE_DIAS:7}
  expiracao-cron: ${ORCAMENTO_EXPIRACAO_CRON:0 0 * * * *}

jwt:
  secret: ${JWT_SECRET:troque-este-segredo-por-uma-chave-bem-longa-e-aleatoria}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

server:
  port: ${APP_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
